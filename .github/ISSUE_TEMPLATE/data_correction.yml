name: Data or format correction
description: Suggest a correction to documented formats or behavior
title: "correction: "
labels: [data-correction]
body:
  - type: markdown
    attributes:
      value: "Do not include real CNICs, phone numbers, or other personal data. This project currently ships no allocation datasets."
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Describe the specific public format rule and cite an authoritative public source.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Authoritative source URL
    validations:
      required: true
